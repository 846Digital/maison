.cuisine-letter{position:relative;display:block;padding:6rem var(--gutter) 9rem;background:var(--color-paper);color:var(--color-ink);min-height:1150px;overflow:clip}.kitchen-label{display:block;max-width:22ch;margin-left:38%;font-size:.6rem}.cuisine-letter h2{position:relative;margin-top:2rem;z-index:2;display:flex;align-items:center;gap:4vw}.cuisine-letter h2>span{font:400 24vw/.95 var(--font-poster);letter-spacing:-.05em;color:var(--color-ink)}.cuisine-letter h2>small{font:400 clamp(1.5rem,3.2vw,3.5rem)/1.3 var(--font-display);letter-spacing:-.03em}.cuisine-portrait{position:absolute;left:var(--gutter);top:31%;width:46%;height:55%;transform:rotate(-6deg);z-index:1}.cuisine-portrait img{width:100%;height:100%;object-fit:cover;clip-path:inset(0 0 0 0 round 50% 50% 0 0)}.cuisine-portrait>span{position:absolute;bottom:-2rem;font-size:.55rem;letter-spacing:.15em}.menu-notes{position:relative;margin:4rem 0 0 61%;z-index:3;width:31%;max-width:420px}.menu-notes article{padding:0 0 2rem}.menu-notes article+article{margin-top:1rem}.menu-notes article>span{font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;color:var(--color-muted)}.menu-notes h3{font-size:1.8rem;line-height:1.3;margin-top:.7rem}.menu-notes article:nth-child(2){margin-left:-3rem}.menu-notes article:nth-child(3){margin-left:1rem}.menu-notes p{font-size:.75rem;margin-top:.7rem;max-width:32ch;color:var(--color-muted)}.menu-notes .line-link{font-size:.72rem}
.house-archive{padding-block:4rem 3rem;overflow:clip}.house-archive .gallery-head{position:relative;padding-inline:var(--gutter);display:block;margin-bottom:3rem;min-height:450px}.house-archive .gallery-head>.eyebrow{position:absolute;right:var(--gutter);top:1rem;width:20ch;text-align:right;font-size:.6rem}.house-archive .gallery-head h2{font:400 clamp(5rem,13vw,12rem)/1.04 var(--font-poster);letter-spacing:-.03em;margin-left:12%;width:60%}.house-archive .gallery-head h2>span{color:var(--color-accent)}.house-archive .gallery-head>p{position:absolute;right:var(--gutter);top:38%;font-size:.7rem}.house-archive .gallery-buttons{position:absolute;left:var(--gutter);bottom:0}.gallery-buttons button{background:var(--color-transparent);color:var(--color-ink)}.gallery-buttons button:hover{background:var(--color-ink);color:var(--color-paper)}.house-archive .gallery-track{gap:6vw;padding-inline:var(--gutter);align-items:flex-start;position:relative}.house-archive figure{position:relative;width:62vw;scroll-snap-align:start}.house-archive figure:nth-child(2){width:38vw;margin-top:4rem}.house-archive figure:nth-child(3){width:58vw;margin-top:1rem}.house-archive img{height:52vh;min-height:380px}.house-archive figure:nth-child(2) img{height:68vh;min-height:430px;clip-path:inset(0 0 0 0 round 50% 50% 0 0)}.house-archive figure:nth-child(3) img{object-position:20%;height:50vh}.archive-number{position:absolute;top:-5rem;right:1rem;z-index:2;font:400 7rem/1 var(--font-display);color:var(--color-ink);opacity:.3;pointer-events:none}.house-archive figcaption{display:block;margin:1.5rem 2rem 0 0;color:var(--color-ink)}.house-archive figcaption h3{font-size:2.1rem}.house-archive figcaption p{font-size:.68rem;margin-top:1rem;color:var(--color-muted);line-height:1.6}.house-archive figcaption .line-link{margin-top:.7rem;font-size:.68rem}.archive-footer{padding:3rem var(--gutter) 0;display:flex;justify-content:space-between;gap:1rem}.archive-footer .eyebrow{font-size:.55rem}.archive-footer>span:last-child{font-size:.68rem;font-variant-numeric:tabular-nums}.house-archive.is-filmstrip{padding-block:2rem}.house-archive.is-filmstrip .gallery-head{min-height:150px;margin-bottom:2rem}.house-archive.is-filmstrip .gallery-head h2{font-size:5.5rem;display:flex;gap:2rem;margin:0 12%}.house-archive.is-filmstrip .gallery-head h2 br{display:none}.house-archive.is-filmstrip .gallery-head>p{display:none}.house-archive.is-filmstrip .gallery-head>.eyebrow{top:0}.house-archive.is-filmstrip img{height:44vh;min-height:280px}.house-archive.is-filmstrip figure:nth-child(2){margin-top:0}.house-archive.is-filmstrip figure:nth-child(2) img{height:44vh;min-height:280px}.house-archive.is-filmstrip figure:nth-child(3) img{height:39vh}.house-archive.is-filmstrip .archive-number{top:-3rem;font-size:5rem}.house-archive.is-filmstrip .archive-footer{padding-top:1rem}.house-archive.is-filmstrip figcaption{margin-top:1rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.2rem 1rem}.house-archive.is-filmstrip figcaption p{grid-column:1;margin-top:.3rem}.house-archive.is-filmstrip figcaption .line-link{grid-column:2;grid-row:1/3;align-self:start;margin-top:0}
.light-stage{position:relative;isolation:isolate;min-height:800px;height:100svh;overflow:clip;color:var(--color-on-dark);--color-rule:var(--color-dark-muted);--color-focus:var(--color-on-dark)}.light-stage>.day-photo,.night-layer,.night-layer img,.light-shade{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.day-photo,.night-layer{z-index:-3}.night-layer{z-index:-2;clip-path:circle(0% at 72% 60%)}.light-shade{z-index:-1;background:var(--color-photo-shade)}.light-caption{position:absolute;left:var(--gutter);top:15%;font-size:.6rem}.light-stage h2{position:absolute;top:25%;left:12%;font-size:clamp(4rem,8.5vw,9rem);line-height:1.14;letter-spacing:-.06em}.light-stage h2>span{display:block}.night-words{opacity:0;position:absolute;inset:0;min-width:7ch}.light-clock{position:absolute;right:9%;bottom:15%;display:flex;align-items:center;gap:2rem}.light-clock svg{width:125px;height:125px;stroke-width:.65}.clock-hand{transform-origin:70px 70px}.light-clock>span{font-size:.55rem;line-height:1.8;letter-spacing:.1em}.light-action{position:absolute;left:var(--gutter);bottom:9%;color:var(--color-on-dark);font-size:.75rem}.light-action:hover{color:var(--color-on-dark)}.light-static .night-layer{clip-path:circle(150% at 72% 60%)}.light-static .day-words{display:none}.light-static .night-words{opacity:1;position:static}
.contact{padding-block:8rem 6rem;position:relative;border:0;background:var(--color-paper);color:var(--color-ink);grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:10vw}.contact .eyebrow{font-size:.6rem}.contact h2{font-size:clamp(3rem,5vw,5rem);line-height:1.18}.contact h2>span{color:var(--color-muted)}.contact-head>p{font-size:.75rem}.enquiry-form input,.enquiry-form select,.enquiry-form textarea{color-scheme:light;color:var(--color-ink)}.enquiry-form select option{background:var(--color-paper)}.request-button{background:var(--color-ink);color:var(--color-paper)}.request-button:hover{background:var(--color-accent)}.form-pair label{font-size:.68rem}.form-explanation,.form-status{color:var(--color-muted)}.site-footer{padding-top:1.5rem;background:var(--color-paper);color:var(--color-ink)}.footer-brand{font-family:var(--font-body);font-size:clamp(1.5rem,4vw,4rem);letter-spacing:.15em;line-height:1.2;text-align:left;margin-block:3rem 1.5rem}.footer-top .eyebrow{font-size:.7rem}.footer-top .replay{font-size:.65rem}
