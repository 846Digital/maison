:root{--color-paper:oklch(95% .012 85);--color-ink:oklch(24% .018 80);--color-muted:oklch(45% .022 80);--color-accent:oklch(43% .046 75);--color-rule:oklch(66% .024 85);--color-light:var(--color-paper);--color-light-ink:var(--color-ink);--color-light-muted:var(--color-muted);--color-field-rule:oklch(52% .018 85);--color-dark:oklch(19% .013 80);--color-on-dark:oklch(94% .018 85);--color-dark-muted:oklch(79% .022 85);--color-photo-shade:oklch(15% .013 80 / .48);--color-focus:oklch(43% .14 65);--color-table-fill:oklch(90% .026 83);--color-table-plate:oklch(97% .008 85);--color-table-gold:oklch(59% .065 78);--font-display:'Prata',Georgia,serif;--font-poster:'Oswald',sans-serif;--gutter:clamp(20px,4.5vw,80px)}
body{background:var(--color-paper);color:var(--color-ink)}html{scroll-padding-top:90px}.site-header{position:fixed;background:var(--color-paper);color:var(--color-ink);padding-block:1rem;border-bottom:1px solid var(--color-rule);height:80px}.brand{align-items:flex-start}.brand>span{font-family:var(--font-body);font-size:1rem;letter-spacing:.14em;font-weight:500}.brand>small{font-size:.5rem;letter-spacing:.1em}.menu-toggle{margin-left:auto}.menu-toggle:before{content:'ПЛАН ДОМА';position:absolute;right:calc(var(--gutter) + 66px);font-size:.6rem;letter-spacing:.12em;white-space:nowrap}.opening{background:var(--color-paper)}.opening-left,.opening-right{display:none}.opening-emblem{color:var(--color-ink)}.opening-emblem span{font-family:var(--font-body);font-size:.8rem}.menu-dialog nav a{font-family:var(--font-display);font-size:clamp(2rem,5vw,4.5rem)}.menu-dialog nav a:hover{color:var(--color-accent)}.menu-dialog nav a>small{color:var(--color-muted)}
.clip-defs{position:absolute;pointer-events:none}.threshold{position:relative;height:100svh;min-height:820px;display:block;isolation:isolate;background:var(--color-paper);overflow:clip}.threshold-copy{position:absolute;left:var(--gutter);top:19%;z-index:2;width:54%}.threshold-copy>.eyebrow{font-size:.61rem}.threshold h1{font-family:var(--font-poster);font-weight:400;font-size:clamp(4.5rem,8.2vw,8.3rem);letter-spacing:-.035em;line-height:1.04;text-align:left;color:var(--color-ink);padding:0;white-space:normal;margin-top:2rem}.threshold h1>span{font-family:var(--font-display);font-size:.45em;letter-spacing:-.02em;display:block;margin-top:.5em}.threshold-copy>p{font-size:.75rem;line-height:1.6;max-width:24ch;margin-top:2rem}.portal-frame{position:absolute;inset:0;z-index:3;clip-path:url('#maison-portal');transform:translateX(21%) scale(.42,.76);transform-origin:center;background:var(--color-dark);pointer-events:none}.portal-photo{width:100%;height:100%;object-fit:cover;transform:scale(2.38,1.315);transform-origin:center}.portal-caption{position:absolute;bottom:10%;inset-inline:0;text-align:center;color:var(--color-on-dark);font-size:.65rem;letter-spacing:.15em;opacity:0}.threshold-bottom{position:absolute;inset-inline:var(--gutter);bottom:3%;z-index:4;display:flex;align-items:end;gap:4rem;justify-content:space-between}.threshold-bottom>.line-link{font-size:.75rem;width:160px}.threshold-bottom>p{font-size:.65rem;max-width:30ch}.threshold-bottom>.eyebrow{font-size:.5rem;text-align:right;max-width:20ch}.architecture-note{position:absolute;right:1.5rem;top:34%;writing-mode:vertical-rl;letter-spacing:.18em;font-size:.55rem}.threshold-tick{position:absolute;bottom:13%;height:30px;width:30px;border-bottom:1px solid var(--color-rule);z-index:1}.tick-left{left:50%;border-left:1px solid var(--color-rule)}.tick-right{right:7%;border-right:1px solid var(--color-rule)}
.table-scene{position:relative}.table-stage{position:relative;min-height:900px;height:110svh;isolation:isolate;overflow:clip}.table-heading{position:absolute;top:11%;left:var(--gutter);z-index:3}.table-heading h2{font-size:clamp(3rem,5.3vw,5rem);letter-spacing:-.04em;margin-top:1.5rem;line-height:1.16}.table-heading .eyebrow{font-size:.58rem}.table-intro{position:absolute;right:var(--gutter);top:14%;width:23%;max-width:30ch;font-size:.76rem;color:var(--color-muted)}.table-board{position:absolute;left:18%;right:18%;top:17%;height:66%;perspective:1400px;z-index:1}.table-svg{width:100%;height:100%;transform:rotateX(45deg) rotateZ(-12deg);overflow:visible;transform-style:preserve-3d;stroke:var(--color-table-gold);stroke-width:1.1;fill:none}.table-svg .table-surface{fill:var(--color-table-fill);stroke:var(--color-table-gold);stroke-width:1.3}.table-svg .place-plate{fill:var(--color-table-plate);stroke:var(--color-table-gold)}.table-svg .table-flower{stroke:var(--color-accent)}.table-svg .table-candle{fill:var(--color-paper)}.table-dish{position:absolute;width:24%;aspect-ratio:1;left:38%;top:36%;border-radius:50%;overflow:clip;box-shadow:0 8px 28px var(--color-shadow);z-index:2}.table-dish img{width:100%;height:100%;object-fit:cover}.table-note{position:absolute;font-size:.65rem;line-height:1.6;z-index:3}.table-note>span{display:block;font-family:var(--font-display);font-size:1.1rem;margin-bottom:.5rem}.note-one{left:10%;top:65%}.note-two{right:7%;top:46%}.note-three{right:18%;bottom:15%}.table-switches{position:absolute;bottom:5%;left:var(--gutter);z-index:5}.table-switches>.eyebrow{font-size:.54rem}.table-switches>div{display:flex;gap:.7rem;margin-top:.9rem;flex-wrap:wrap}.table-switches button{font-size:.7rem;min-height:44px;padding:.4rem 1rem;border:1px solid var(--color-rule);border-radius:0;transition:background .2s,color .2s}.table-switches button[aria-pressed=true]{background:var(--color-ink);color:var(--color-paper)}.table-switches button:hover{border-color:var(-